version: '3.8'

services:
  app:
    # build: .
    image: jjdock1112/raindigest:latest
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./.env:/app/.env
      - ./src:/app/src
      # Claude Code CLI: share binary + auth from host
      - /root/.local/share/claude:/root/.local/share/claude:ro
      - /root/.local/bin/claude:/usr/local/bin/claude:ro
      - /root/.claude:/root/.claude
      - /root/.claude.json:/root/.claude.json
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    # For development, you might want to keep it running
    # command: tail -f /dev/null
    # For production task:
    restart: always
    # For production task (Service Mode for NAS):
    # Run once, sleep 1 hour (3600s), then loop.
    command: sh -c "while true; do python -m src.main; echo 'Sleeping 1 hour...'; sleep 3600; done"
